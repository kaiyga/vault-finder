<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vault Configuration</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="settings-wrapper">
    <h2>Vault Configuration</h2>
    
    <label for="vault_url">Vault URL (trailing slash omitted)</label>
    <input type="text" id="vault_url" placeholder="http://127.0.0.1:8200">

    <label for="username">Username (UserPass)</label>
    <input type="text" id="username">

    <label for="password">Password</label>
    <input type="password" id="password">

    <label for="kv_engine">KV Engine (e.g. kv)</label>
    <input type="text" id="kv_engine" value="kv">

    <label for="secret_path">Directory (e.g. users/kaiyga)</label>
    <input type="text" id="secret_path" placeholder="users/kaiyga">

    <button id="save">Save and Test Connection</button>
    <div id="status"></div>

    <div class="divider"></div>

    <!-- Toggle button for the custom CSS editor block -->
    <button id="toggle-editor-btn" class="btn-secondary">Open CSS Editor</button>

    <!-- Hidden collapsible CSS editor container -->
    <div id="css-editor-wrapper" class="hidden">
      <label for="custom-css-editor">Custom Appearance Styles (CSS):</label>
      <textarea id="custom-css-editor" placeholder="/* Inject your custom CSS rules here */"></textarea>
      <div class="editor-actions">
        <button id="apply-css-btn" class="btn-secondary">Apply Styles</button>
      </div>
    </div>
  </div>

  <!-- Dynamic injection container for user-defined styles -->
  <style id="dynamic-custom-style"></style>

  <script src="options.js"></script>
</body>
</html>
