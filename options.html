<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vault Configuration</title>
  <!-- Link to the unified design system -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-options">
  <div class="settings-wrapper">
    <h2>Vault Configuration</h2>
    
    <label for="vault_url">Vault URL (trailing slash omitted)</label>
    <input type="text" id="vault_url" placeholder="http://127.0.0.1:8200">

    <label for="auth_type">Authentication Method</label>
    <select id="auth_type">
      <option value="userpass">UserPass</option>
      <option value="ldap">LDAP</option>
      <option value="token">Token</option>
    </select>

    <div id="credentials-group">
      <label for="username">Username</label>
      <input type="text" id="username">

      <label for="password">Password</label>
      <input type="password" id="password">
    </div>

    <div id="token-group" class="hidden">
      <label for="vault_token">Vault Token</label>
      <input type="password" id="vault_token" placeholder="hvb.xxx / s.xxx">
    </div>

    <div class="divider"></div>

    <h2>Directories</h2>
    <div id="directories-container"></div>
    <button id="add-directory-btn" class="btn-secondary">+ Add Directory</button>

    <div class="divider"></div>

    <button id="save" class="btn-block">Save and Test Connection</button>
    <div id="status" class="neutral" style="margin-top: 15px;"></div>

    <button id="toggle-editor-btn" class="btn-secondary btn-block">Open CSS Editor</button>

    <div id="css-editor-wrapper" class="hidden">
      <label for="custom-css-editor">Custom Appearance Styles (CSS):</label>
      <textarea id="custom-css-editor" placeholder="/* Example: :root { --vault-bg-base: #000; } */"></textarea>
      <div class="editor-actions">
        <button id="apply-css-btn" class="btn-secondary">Apply Styles</button>
      </div>
    </div>
  </div>

  <style id="dynamic-custom-style"></style>
  <script src="options.js"></script>
</body>
</html>
