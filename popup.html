<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { background: #121212; color: #e0e0e0; font-family: monospace; width: 350px; padding: 10px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .header span { font-weight: bold; }
    .header-buttons { display: flex; gap: 5px; }
    
    input { width: 100%; padding: 6px; box-sizing: border-box; background: #1e1e1e; border: 1px solid #333; color: #e0e0e0; margin-bottom: 10px; font-family: inherit; }
    input:focus { outline: none; border-color: #555; }
    input:read-only { background: #111; color: #777; border-color: #222; }
    
    button { background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; padding: 4px 8px; cursor: pointer; font-family: inherit; font-size: 11px; }
    button:hover { background: #3a3a3a; }
    
    /* Списки секретов */
    .secret-item { padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
    .secret-header { display: flex; justify-content: space-between; align-items: center; }
    .secret-name { cursor: pointer; color: #88ccff; text-decoration: underline; word-break: break-all; margin-right: 10px; flex-grow: 1; }
    .secret-name:hover { color: #bbddff; }
    .secret-actions { display: flex; gap: 4px; }
    
    .keys-container { margin-top: 8px; margin-left: 10px; padding-left: 10px; border-left: 1px solid #444; display: none; }
    .key-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px dashed #333; }
    .key-item:last-child { border-bottom: none; }
    
    /* Кликабельное имя ключа */
    .key-name { color: #ccc; word-break: break-all; margin-right: 10px; font-size: 11px; cursor: pointer; }
    .key-name:hover { color: #fff; text-decoration: underline; }

    #message, #create-message { font-size: 11px; margin-bottom: 10px; min-height: 14px; }
    .error { color: #ff5555; }
    .success { color: #55ff55; }
    .neutral { color: #aaaaaa; }

    /* Форма создания / редактирования */
    #create-view { display: none; }
    .kv-row { display: flex; gap: 5px; margin-bottom: 5px; }
    .kv-row input { margin-bottom: 0; }
    .btn-remove-row { background: #551111; border-color: #771111; padding: 4px 6px; }
    .btn-remove-row:hover { background: #771111; }
    .btn-action-group { display: flex; justify-content: space-between; margin-top: 15px; }
    .btn-success { background: #115511; border-color: #117711; }
    .btn-success:hover { background: #117711; }
    
    .btn-create-bottom { width: 100%; margin-top: 10px; padding: 8px; border-style: dashed; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <span>Vault Finder</span>
    <div class="header-buttons">
      <button id="open-settings">Настройки</button>
    </div>
  </div>
  
  <div id="main-view">
    <input type="text" id="search" placeholder="Поиск секрета...">
    <div id="message" class="neutral"></div>
    <div id="secrets-list"></div>
  </div>

  <div id="create-view">
    <div id="create-message" class="neutral">Заполните данные секрета</div>
    <input type="text" id="new-secret-name" placeholder="Имя секрета (напр: my_app)">
    
    <div id="kv-rows"></div>
    
    <button id="add-kv-row" style="width: 100%; margin-top: 5px;">+ Добавить ключ</button>
    
    <div class="btn-action-group">
      <button id="cancel-create">Отмена</button>
      <button id="save-secret" class="btn-success">Сохранить</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
